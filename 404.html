<style>

    --accent: #E8B93C; --accent-text: #181818;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 8px 12px; border-radius: 12px; border: 1px solid transparent;
    font: inherit; font-size: 16px; line-height: 24px; font-weight: 600;
    text-decoration: none; cursor: pointer; background: var(--accent); color: var(--accent-text);
    transition: background-color 300ms var(--ease), transform 300ms var(--ease);
  }
  .btn:hover { background: #F0C44E; }
  .btn:active { transform: scale(0.98); }
  .btn .icon { width: 20px; height: 20px; color: var(--accent-text); margin: 0; }
  @media (max-width: 390px) {
    h1 { font-size: 36px; line-height: 40px; }
